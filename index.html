<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Investment OS</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#04070f;font-family:'IBM Plex Mono',monospace;color:#e2e8f0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#080e1a}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
input,textarea,select,button{font-family:'IBM Plex Mono',monospace}
select option{background:#080e1a;color:#e2e8f0}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fade{animation:fadeIn .2s ease forwards}
.pulse{animation:pulse 2s ease infinite}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const e = React.createElement;
const {useState, useEffect, useCallback} = React;

const C = {
  bg:"#04070f",surface:"#080e1a",card:"#0c1424",
  border:"#112240",green:"#00ff88",blue:"#4fc3f7",
  amber:"#ffb347",red:"#ff4757",purple:"#c084fc",
  cyan:"#22d3ee",text:"#e2e8f0",muted:"#64748b",faint:"#1e2d40"
};

const INIT_PORTFOLIO = [
  {ticker:"QQQ", weight:50, fairValue:650, buyZone:500, stopLoss:450, type:"etf", thesis:"Tech/AI infrastructure basket — companies building the backbone of the AI era"},
  {ticker:"VXUS",weight:15, fairValue:68,  buyZone:52,  stopLoss:44,  type:"etf", thesis:"Global diversification — emerging + developed markets in digitalization era"},
  {ticker:"AMZN",weight:10, fairValue:360, buyZone:277, stopLoss:170, type:"stock",thesis:"$200B capex conviction bet on AI infrastructure. $244B backlog already locked."},
  {ticker:"INTU",weight:10, fairValue:694, buyZone:534, stopLoss:360, type:"stock",thesis:"Fast AI adopter, 56% below fair value. QuickBooks moat intact."},
  {ticker:"TSM", weight:10, fairValue:439, buyZone:338, stopLoss:240, type:"stock",thesis:"Monopoly on advanced chip manufacturing. 2nm fully booked. AI can't exist without TSM."},
  {ticker:"CASH",weight:5,  fairValue:null,buyZone:null, stopLoss:null,type:"cash", thesis:"Dip reserve: QQQ -7% > $800, QQQ -12% > $800, QQQ -20% > $400"},
];
const INIT_WATCHLIST = [
  {id:1,ticker:"LLY", fairValue:1713,buyZone:1318,currentPrice:1082,upside:58, notes:"GLP-1 king. Q2 oral pill catalyst.",status:"BUY"},
  {id:2,ticker:"GEV", fairValue:819, buyZone:630, currentPrice:811, upside:1,  notes:"AI needs power. $150B backlog. Wait for $630.",status:"WAIT"},
  {id:3,ticker:"NVDA",fairValue:270, buyZone:208, currentPrice:189, upside:43, notes:"AI chip king on sale. 37/39 analyst buys.",status:"BUY"},
  {id:4,ticker:"LULU",fairValue:350, buyZone:192, currentPrice:170, upside:106,notes:"14x P/E for premium brand. New CEO catalyst needed.",status:"WATCH"},
];
const INIT_THESIS = "My macro thesis is that technology is not a sector — it is infrastructure that will integrate into every industry.\n\nQQQ (50%): Building the tools and infrastructure that all other industries will run on.\n\nEmerging Markets (15%): Developing economies in the digitalization phase. Growth curves are exponential.\n\nIndividual Stocks (30%): Companies building critical AI infrastructure (TSM), adopting AI while undervalued (INTU), or making massive conviction bets on AI (AMZN $200B capex).\n\nWhat would break this thesis:\n- AI proves to be a bubble with no real enterprise ROI\n- Geopolitical shock disrupts semiconductor supply chains\n- Regulatory crackdown on big tech";

const ls = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

let fbDb=null, fbUnsub=null;
function initFb(cfg){
  try{
    if(firebase.apps.length) firebase.apps.forEach(function(a){a.delete();});
    firebase.initializeApp(cfg);
    fbDb=firebase.firestore();
    return true;
  }catch(err){console.error(err);return false;}
}

const fmt = function(n){return n==null?"—":"$"+Number(n).toLocaleString();};
const today = function(){return new Date().toISOString().split("T")[0];};
const genKey = function(){return Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.random().toString(36).slice(2,8).toUpperCase();};

const baseInput = {background:C.surface,border:"1px solid "+C.border,color:C.text,padding:"8px 12px",borderRadius:"6px",fontSize:"12px",outline:"none",width:"100%",boxSizing:"border-box"};

function merge(a,b){return Object.assign({},a,b||{});}

function Badge(props){
  return e("span",{style:{background:props.color+"22",color:props.color,border:"1px solid "+props.color+"44",padding:props.small?"1px 6px":"2px 8px",borderRadius:"3px",fontSize:props.small?"10px":"11px",fontWeight:"700",letterSpacing:"1px"}},props.children);
}
function Inp(props){
  return e("input",{type:props.type||"text",value:props.value,onChange:function(ev){props.onChange(ev.target.value);},placeholder:props.placeholder||"",style:merge(baseInput,props.extraStyle)});
}
function TA(props){
  return e("textarea",{value:props.value,onChange:function(ev){props.onChange(ev.target.value);},placeholder:props.placeholder||"",rows:props.rows||3,style:merge(baseInput,{resize:"vertical",padding:"10px 12px"})});
}
function Btn(props){
  var col=props.color||C.green;
  return e("button",{onClick:props.onClick,disabled:props.disabled,style:{background:props.outline?"transparent":col+"22",border:"1px solid "+col+(props.disabled?"33":"66"),color:props.disabled?C.muted:col,padding:props.small?"5px 12px":"8px 16px",borderRadius:"6px",cursor:props.disabled?"not-allowed":"pointer",fontSize:props.small?"11px":"12px",fontWeight:"600",opacity:props.disabled?.5:1}},props.children);
}
function Section(props){
  return e("div",{style:{marginBottom:"28px"}},
    e("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px",paddingBottom:"10px",borderBottom:"1px solid "+C.border}},
      e("div",{style:{width:"3px",height:"16px",background:props.accent||C.green,borderRadius:"2px"}}),
      e("span",{style:{fontSize:"11px",color:props.accent||C.green,letterSpacing:"3px",textTransform:"uppercase"}},props.title)
    ),
    props.children
  );
}
function Label(props){
  return e("div",{style:{fontSize:"10px",color:props.color||C.muted,marginBottom:"4px",letterSpacing:"1px"}},props.text);
}
function Card(props){
  return e("div",{style:merge({background:C.card,border:"1px solid "+C.border,borderRadius:"8px",padding:"16px",marginBottom:"8px"},props.extraStyle)},props.children);
}

const TABS=[
  {id:"portfolio",label:"Portfolio",icon:"◈"},
  {id:"journal",  label:"Journal",  icon:"◎"},
  {id:"valuation",label:"Valuation",icon:"◆"},
  {id:"watchlist",label:"Watchlist",icon:"◉"},
  {id:"research", label:"Research", icon:"◐"},
  {id:"thesis",   label:"Thesis",   icon:"◑"},
  {id:"sync",     label:"Sync",     icon:"⟳"},
];

function App(){
  var s = useState;
  var tab=s("portfolio"), setTab=tab[1]; tab=tab[0];
  var pf=s(INIT_PORTFOLIO), setPf=pf[1]; pf=pf[0];
  var jn=s([]), setJn=jn[1]; jn=jn[0];
  var wl=s(INIT_WATCHLIST), setWl=wl[1]; wl=wl[0];
  var th=s(INIT_THESIS), setTh=th[1]; th=th[0];
  var ck=s({}), setCk=ck[1]; ck=ck[0];
  var sc=s(null), setSc=sc[1]; sc=sc[0];
  var ss=s("offline"), setSs=ss[1]; ss=ss[0];
  var sm=s(""), setSm=sm[1]; sm=sm[0];
  var ld=s(false), setLd=ld[1]; ld=ld[0];

  useEffect(function(){
    setPf(ls.get("inv_portfolio",INIT_PORTFOLIO));
    setJn(ls.get("inv_journal",[]));
    setWl(ls.get("inv_watchlist",INIT_WATCHLIST));
    setTh(ls.get("inv_thesis",INIT_THESIS));
    setCk(ls.get("inv_checks",{}));
    var cfg=ls.get("inv_syncCfg",null);
    if(cfg) setSc(cfg);
    setLd(true);
  },[]);

  useEffect(function(){
    if(!ld||!sc) return;
    connectFb(sc);
    return function(){if(fbUnsub){fbUnsub();fbUnsub=null;}};
  },[ld,sc]);

  function connectFb(cfg){
    setSs("connecting");
    try{
      var ok=initFb(cfg.firebaseConfig);
      if(!ok){setSs("error");setSm("Firebase init failed. Check your config.");return;}
      if(fbUnsub) fbUnsub();
      fbUnsub=fbDb.collection("investmentOS").doc(cfg.syncKey).onSnapshot(
        function(snap){
          if(snap.exists){
            var d=snap.data();
            if(d.portfolio){setPf(d.portfolio);ls.set("inv_portfolio",d.portfolio);}
            if(d.journal)  {setJn(d.journal);  ls.set("inv_journal",d.journal);}
            if(d.watchlist){setWl(d.watchlist); ls.set("inv_watchlist",d.watchlist);}
            if(d.thesis)   {setTh(d.thesis);    ls.set("inv_thesis",d.thesis);}
            if(d.checks)   {setCk(d.checks);    ls.set("inv_checks",d.checks);}
          }
          setSs("synced");setSm("All devices synced");
        },
        function(err){setSs("error");setSm("Sync error: "+err.message);}
      );
    }catch(err){setSs("error");setSm("Connection failed: "+err.message);}
  }

  var save=useCallback(function(key,val){
    ls.set("inv_"+key,val);
    if(fbDb&&sc){
      setSs("syncing");
      fbDb.collection("investmentOS").doc(sc.syncKey)
        .set(Object.defineProperty({},""+key,{value:val,enumerable:true}),{merge:true})
        .then(function(){setSs("synced");setSm("All devices synced");})
        .catch(function(err){setSs("error");setSm("Save failed: "+err.message);});
    }
  },[sc]);

  // simpler save with dynamic key
  function saveKey(key,val){
    ls.set("inv_"+key,val);
    if(fbDb&&sc){
      setSs("syncing");
      var obj={};obj[key]=val;
      fbDb.collection("investmentOS").doc(sc.syncKey)
        .set(obj,{merge:true})
        .then(function(){setSs("synced");setSm("All devices synced");})
        .catch(function(err){setSs("error");setSm("Save failed: "+err.message);});
    }
  }

  function upPf(v){setPf(v);saveKey("portfolio",v);}
  function upJn(v){setJn(v);saveKey("journal",v);}
  function upWl(v){setWl(v);saveKey("watchlist",v);}
  function upTh(v){setTh(v);saveKey("thesis",v);}
  function upCk(v){setCk(v);saveKey("checks",v);}

  function activateSync(cfg){
    ls.set("inv_syncCfg",cfg);
    setSc(cfg);
    connectFb(cfg);
  }
  function disconnect(){
    if(fbUnsub){fbUnsub();fbUnsub=null;}
    ls.set("inv_syncCfg",null);
    setSc(null);setSs("offline");setSm("");
    fbDb=null;
    try{if(firebase.apps.length) firebase.apps.forEach(function(a){a.delete();});}catch(x){}
  }

  if(!ld) return e("div",{style:{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.green}},"Loading...");

  var stC={offline:C.muted,connecting:C.amber,syncing:C.amber,synced:C.green,error:C.red};
  var stI={offline:"○",connecting:"◌",syncing:"◌",synced:"●",error:"✕"};
  var stL={offline:"Local only",connecting:"Connecting",syncing:"Saving...",synced:"Cloud synced",error:"Sync error"};
  var statusColor=stC[ss];

  return e("div",{style:{background:C.bg,minHeight:"100vh"}},
    e("div",{style:{borderBottom:"1px solid "+C.border,padding:"14px 24px",display:"flex",justifyContent:"space-between",alignItems:"center",background:C.surface}},
      e("div",null,
        e("div",{style:{fontSize:"11px",color:C.green,letterSpacing:"4px",textTransform:"uppercase"}},"◈ Investment OS"),
        e("div",{style:{fontSize:"12px",color:C.muted,marginTop:"2px"}},"Personal trading system")
      ),
      e("div",{style:{display:"flex",alignItems:"center",gap:"16px"}},
        e("div",{onClick:function(){setTab("sync");},style:{display:"flex",alignItems:"center",gap:"6px",background:statusColor+"15",border:"1px solid "+statusColor+"33",borderRadius:"20px",padding:"4px 12px",cursor:"pointer"}},
          e("span",{style:{color:statusColor,fontSize:"9px"},className:ss==="syncing"||ss==="connecting"?"pulse":""},stI[ss]),
          e("span",{style:{fontSize:"10px",color:statusColor,letterSpacing:"1px",textTransform:"uppercase"}},stL[ss])
        ),
        e("div",{style:{fontSize:"11px",color:C.muted}},today())
      )
    ),
    e("div",{style:{display:"flex",gap:"2px",padding:"12px 24px",background:C.surface,borderBottom:"1px solid "+C.border,overflowX:"auto"}},
      TABS.map(function(t){
        var active=tab===t.id;
        var col=t.id==="sync"?C.cyan:C.green;
        return e("button",{key:t.id,onClick:function(){setTab(t.id);},style:{padding:"7px 16px",borderRadius:"5px",border:"none",cursor:"pointer",background:active?col+"22":"transparent",color:active?col:C.muted,fontSize:"12px",fontWeight:active?"700":"400",borderBottom:active?"2px solid "+col:"2px solid transparent",whiteSpace:"nowrap",transition:"all .15s"}},t.icon+" "+t.label);
      })
    ),
    e("div",{style:{padding:"24px",maxWidth:"1000px",margin:"0 auto"}},
      tab==="portfolio" && e(PortfolioTab,{portfolio:pf,update:upPf}),
      tab==="journal"   && e(JournalTab,  {journal:jn,  update:upJn}),
      tab==="valuation" && e(ValuationTab,null),
      tab==="watchlist" && e(WatchlistTab,{watchlist:wl, update:upWl}),
      tab==="research"  && e(ResearchTab, {checks:ck,   update:upCk}),
      tab==="thesis"    && e(ThesisTab,   {thesis:th,   update:upTh}),
      tab==="sync"      && e(SyncTab,{syncCfg:sc,syncStatus:ss,syncMsg:sm,onConnect:activateSync,onDisconnect:disconnect})
    )
  );
}

function PortfolioTab(props){
  var portfolio=props.portfolio, update=props.update;
  var editing=useState(null), setEditing=editing[1]; editing=editing[0];
  var nT=useState(""), setNT=nT[1]; nT=nT[0];
  var nW=useState(""), setNW=nW[1]; nW=nW[0];
  var total=portfolio.reduce(function(s,p){return s+(parseFloat(p.weight)||0);},0);
  var COLS=[C.green,C.blue,C.amber,C.purple,C.red,C.cyan];

  function updF(i,field,val){var p=portfolio.slice();p[i]=Object.assign({},p[i]);p[i][field]=val;update(p);}
  function addPos(){
    if(!nT||!nW) return;
    update(portfolio.concat([{ticker:nT.toUpperCase(),weight:parseFloat(nW),fairValue:null,buyZone:null,stopLoss:null,thesis:"",type:"stock"}]));
    setNT("");setNW("");
  }

  return e("div",null,
    e(Section,{title:"Current Allocation",accent:C.green},
      e("div",{style:{marginBottom:"20px"}},
        e("div",{style:{display:"flex",height:"8px",borderRadius:"4px",overflow:"hidden",marginBottom:"8px"}},
          portfolio.filter(function(p){return p.ticker!=="CASH";}).map(function(p,i){
            return e("div",{key:i,style:{width:p.weight+"%",background:COLS[i%COLS.length],opacity:.8},title:p.ticker+": "+p.weight+"%"});
          })
        ),
        e("div",{style:{display:"flex",gap:"16px",flexWrap:"wrap"}},
          portfolio.map(function(p,i){return e("span",{key:i,style:{fontSize:"10px",color:COLS[i%COLS.length],letterSpacing:"1px"}},"■ "+p.ticker+" "+p.weight+"%");})
        )
      ),
      e("div",{style:{padding:"8px 14px",borderRadius:"6px",marginBottom:"16px",background:Math.abs(total-100)<.5?"#00ff8840":"#ffb34720",border:"1px solid "+(Math.abs(total-100)<.5?C.green:C.amber)+"44",fontSize:"12px",color:Math.abs(total-100)<.5?C.green:C.amber}},
        "Total: "+total.toFixed(1)+"% "+(Math.abs(total-100)<.5?"✓ Balanced":"⚠ Adjust to 100%")
      ),
      portfolio.map(function(pos,i){
        return e(Card,{key:i},
          editing===i
          ? e("div",null,
              e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"8px"}},
                [["WEIGHT %","weight"],["FAIR VALUE","fairValue"],["BUY ZONE","buyZone"],["STOP LOSS","stopLoss"]].map(function(pair){
                  return e("div",{key:pair[1]},
                    e(Label,{text:pair[0]}),
                    e(Inp,{value:pos[pair[1]]||"",onChange:function(v){updF(i,pair[1],pair[1]==="weight"?parseFloat(v)||0:parseFloat(v)||null);},type:"number",placeholder:"$"})
                  );
                })
              ),
              e("div",{style:{marginBottom:"8px"}},
                e(Label,{text:"THESIS"}),
                e(TA,{value:pos.thesis,onChange:function(v){updF(i,"thesis",v);},placeholder:"Why do you own this?",rows:2})
              ),
              e("div",{style:{display:"flex",gap:"8px"}},
                e(Btn,{onClick:function(){setEditing(null);},color:C.green,small:true},"Save"),
                e(Btn,{onClick:function(){update(portfolio.filter(function(_,idx){return idx!==i;}));setEditing(null);},color:C.red,small:true,outline:true},"Remove")
              )
            )
          : e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
              e("div",{style:{flex:1}},
                e("div",{style:{display:"flex",gap:"10px",alignItems:"center",marginBottom:"6px"}},
                  e("span",{style:{fontSize:"15px",fontWeight:"700",color:C.text}},pos.ticker),
                  e(Badge,{color:pos.weight/100>.4?C.amber:pos.weight/100>.2?C.blue:C.green},pos.weight+"%"),
                  e(Badge,{color:C.muted,small:true},pos.type.toUpperCase())
                ),
                pos.thesis&&e("div",{style:{fontSize:"11px",color:C.muted,lineHeight:"1.6",maxWidth:"600px"}},pos.thesis.substring(0,120)+(pos.thesis.length>120?"...":"")),
                e("div",{style:{display:"flex",gap:"16px",marginTop:"8px",flexWrap:"wrap"}},
                  pos.fairValue&&e("span",{key:"fv",style:{fontSize:"11px",color:C.blue}},"Target: "+fmt(pos.fairValue)),
                  pos.buyZone  &&e("span",{key:"bz",style:{fontSize:"11px",color:C.green}},"Buy: "+fmt(pos.buyZone)),
                  pos.stopLoss &&e("span",{key:"sl",style:{fontSize:"11px",color:C.red}},"Stop: "+fmt(pos.stopLoss)),
                  e("span",{key:"val",style:{fontSize:"11px",color:C.muted}},"≈ "+fmt(40000*pos.weight/100))
                )
              ),
              e(Btn,{onClick:function(){setEditing(i);},color:C.blue,small:true,outline:true},"Edit")
            )
        );
      }),
      e("div",{style:{background:C.card,border:"1px dashed "+C.border,borderRadius:"8px",padding:"16px",marginTop:"12px"}},
        e(Label,{text:"ADD POSITION"}),
        e("div",{style:{display:"flex",gap:"8px",marginTop:"8px"}},
          e(Inp,{value:nT,onChange:function(v){setNT(v.toUpperCase());},placeholder:"TICKER",extraStyle:{width:"100px"}}),
          e(Inp,{value:nW,onChange:setNW,placeholder:"Weight %",type:"number",extraStyle:{width:"100px"}}),
          e(Btn,{onClick:addPos,color:C.green},"Add")
        )
      )
    )
  );
}

function JournalTab(props){
  var journal=props.journal, update=props.update;
  var empty={date:today(),ticker:"",action:"BUY",price:"",shares:"",thesis:"",whatCouldGoWrong:"",target:"",timeline:"",sentiment:"NEUTRAL"};
  var form=useState(empty), setForm=form[1]; form=form[0];
  var expanded=useState(null), setExpanded=expanded[1]; expanded=expanded[0];
  var aColor=function(a){return a==="BUY"?C.green:a==="SELL"?C.red:C.amber;};
  var sColor=function(s){return s==="BULLISH"?C.green:s==="BEARISH"?C.red:C.muted;};
  var selStyle=function(col){return {background:C.surface,border:"1px solid "+C.border,color:col,padding:"8px 12px",borderRadius:"6px",fontSize:"12px",width:"100%",outline:"none"};};

  function addEntry(){
    if(!form.ticker||!form.price) return;
    update([Object.assign({},form,{id:Date.now()})].concat(journal));
    setForm(empty);
  }

  return e("div",null,
    e(Section,{title:"New Journal Entry",accent:C.blue},
      e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"10px"}},
        e("div",null,e(Label,{text:"DATE"}),e(Inp,{value:form.date,onChange:function(v){setForm(function(f){return Object.assign({},f,{date:v});});},type:"date"})),
        e("div",null,e(Label,{text:"TICKER"}),e(Inp,{value:form.ticker,onChange:function(v){setForm(function(f){return Object.assign({},f,{ticker:v.toUpperCase()});});},placeholder:"e.g. AMZN"})),
        e("div",null,e(Label,{text:"ACTION"}),e("select",{value:form.action,onChange:function(ev){setForm(function(f){return Object.assign({},f,{action:ev.target.value});});},style:selStyle(aColor(form.action))},["BUY","SELL","HOLD"].map(function(a){return e("option",{key:a,value:a},a);}))),
        e("div",null,e(Label,{text:"PRICE"}),e(Inp,{value:form.price,onChange:function(v){setForm(function(f){return Object.assign({},f,{price:v});});},placeholder:"$",type:"number"})),
        e("div",null,e(Label,{text:"SHARES"}),e(Inp,{value:form.shares,onChange:function(v){setForm(function(f){return Object.assign({},f,{shares:v});});},placeholder:"qty",type:"number"})),
        e("div",null,e(Label,{text:"SENTIMENT"}),e("select",{value:form.sentiment,onChange:function(ev){setForm(function(f){return Object.assign({},f,{sentiment:ev.target.value});});},style:selStyle(sColor(form.sentiment))},["BULLISH","NEUTRAL","BEARISH"].map(function(s){return e("option",{key:s,value:s},s);})))
      ),
      e("div",{style:{marginBottom:"10px"}},e(Label,{text:"THESIS"}),e(TA,{value:form.thesis,onChange:function(v){setForm(function(f){return Object.assign({},f,{thesis:v});});},placeholder:"Why are you doing this? Be specific.",rows:3})),
      e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}},
        e("div",null,e(Label,{text:"WHAT COULD MAKE ME WRONG?"}),e(TA,{value:form.whatCouldGoWrong,onChange:function(v){setForm(function(f){return Object.assign({},f,{whatCouldGoWrong:v});});},placeholder:"Risks, bear case...",rows:2})),

function SyncTab(props){

  var keyState=useState(genKey()), setKey=keyState[1]; var key=keyState[0];
  var errState=useState(""), setErr=errState[1]; var err=errState[0];
  var busyState=useState(false), setBusy=busyState[1]; var busy=busyState[0];

  var stC={offline:C.muted,connecting:C.amber,syncing:C.amber,synced:C.green,error:C.red};
  var sc=stC[syncStatus];

  function parseConfig(){
    try{
      var t=ct.trim();
      var m=t.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\})/);
      if(m) t=m[1];
      try{var p=JSON.parse(t);if(p.apiKey&&p.projectId){setErr("");return p;}}catch(x){}
      var obj=t.match(/\{[\s\S]*\}/);
      if(obj){
        var json=obj[0].replace(/\/\/.*/g,"").replace(/,(\s*[}\]])/g,"$1").replace(/([{,]\s*)(\w+)\s*:/g,'$1"$2":').replace(/:\s*'([^']*)'/g,':"$1"');
        var p2=JSON.parse(json);
        if(p2.apiKey&&p2.projectId){setErr("");return p2;}
      }
      setErr("Could not parse config. Copy just the { } object.");return null;
    }catch(x){setErr("Invalid config format.");return null;}
  }

  function handleConnect(){
    var cfg=parseConfig();
    if(!cfg) return;
    if(!key.trim()){setErr("Please enter a sync key.");return;}
    setBusy(true);setErr("");
    setTimeout(function(){
      onConnect({firebaseConfig:cfg,syncKey:key.trim().toUpperCase()});
      setBusy(false);setStep("connected");
    },300);
  }

  if(step==="connected"||syncCfg){
    return e("div",null,
      e(Section,{title:"Cloud Sync Status",accent:C.cyan},
        e("div",{style:{background:sc+"15",border:"1px solid "+sc+"33",borderRadius:"12px",padding:"24px",marginBottom:"20px",textAlign:"center"}},
          e("div",{style:{fontSize:"32px",color:sc,marginBottom:"8px",fontWeight:"700"}},syncStatus==="synced"?"✓":syncStatus==="error"?"✕":"◌"),
          e("div",{style:{fontSize:"15px",color:sc,fontWeight:"700",marginBottom:"4px",textTransform:"uppercase",letterSpacing:"2px"}},syncStatus==="synced"?"All Devices Synced":syncStatus==="error"?"Sync Error":"Connecting..."),
          syncMsg&&e("div",{style:{fontSize:"12px",color:C.muted,marginTop:"6px"}},syncMsg)
        ),
        e(Card,null,
          e(Label,{text:"YOUR SYNC KEY"}),
          e("div",{style:{fontSize:"20px",color:C.cyan,fontWeight:"700",letterSpacing:"4px",margin:"8px 0"}},syncCfg&&syncCfg.syncKey),
          e("div",{style:{fontSize:"11px",color:C.muted}},"Enter this key on any device to access your data.")
        ),
        e(Card,null,
          e(Label,{text:"ACCESS FROM ANOTHER DEVICE"}),
          e("div",{style:{fontSize:"12px",color:C.text,lineHeight:"1.9",marginTop:"6px"}},
            ["1. Open your GitHub Pages URL on the other device",
             "2. Go to the ⟳ Sync tab",
             "3. Click 'Already have a key?'",
             "4. Paste your Firebase config + your sync key",
             "5. Your data loads automatically ✓"
            ].map(function(t,i){return e("div",{key:i},t);})
          )
        ),
        e(Btn,{onClick:onDisconnect,color:C.red,outline:true},"Disconnect Sync")
      )
    );
  }

  var steps=["Create Firebase","Copy Config","Set Sync Key"];

  return e("div",null,
    e("div",{style:{background:C.card,border:"1px solid "+C.cyan+"33",borderRadius:"8px",padding:"16px",marginBottom:"24px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      e("div",null,
        e("div",{style:{fontSize:"12px",color:C.cyan,fontWeight:"700",marginBottom:"2px"}},"Already have a sync key?"),
        e("div",{style:{fontSize:"11px",color:C.muted}},"Connect to existing data")
      ),
      e(Btn,{onClick:function(){setStep("existing");},color:C.cyan,outline:true,small:true},"Connect with key →")
    ),
    step==="existing"&&e(Section,{title:"Connect to Existing Data",accent:C.cyan},
      e("div",{style:{marginBottom:"10px"}},e(Label,{text:"FIREBASE CONFIG"}),e(TA,{value:ct,onChange:setCt,placeholder:"Paste your Firebase config { } here",rows:8})),
      e("div",{style:{marginBottom:"12px"}},e(Label,{text:"YOUR SYNC KEY"}),e(Inp,{value:key,onChange:function(v){setKey(v.toUpperCase());},placeholder:"e.g. ABCD12-EF3456"})),
      err&&e("div",{style:{fontSize:"11px",color:C.red,marginBottom:"12px"}},err),
      e("div",{style:{display:"flex",gap:"8px"}},
        e(Btn,{onClick:handleConnect,color:C.cyan,disabled:busy},busy?"Connecting...":"Connect →"),
        e(Btn,{onClick:function(){setStep(1);},color:C.muted,outline:true,small:true},"Back")
      )
    ),
    step!=="existing"&&e("div",null,
      e("div",{style:{display:"flex",gap:"8px",marginBottom:"28px"}},
        steps.map(function(s,i){
          return e("div",{key:i,style:{flex:1,textAlign:"center"}},
            e("div",{style:{height:"3px",background:step>i+1?C.green:step===i+1?C.cyan:C.faint,borderRadius:"2px",marginBottom:"6px"}}),
            e("div",{style:{fontSize:"9px",color:step===i+1?C.cyan:step>i+1?C.green:C.muted,letterSpacing:"1px"}},(step>i+1?"✓ ":"")+s.toUpperCase())
          );
        })
      ),
      step===1&&e(Section,{title:"Step 1 — Create a Free Firebase Project",accent:C.cyan},
        e("div",{style:{fontSize:"12px",color:C.muted,marginBottom:"20px",lineHeight:"1.8"}},"Firebase is Google's free cloud database. Setup takes about 3 minutes."),
        [
          ["1","Go to console.firebase.google.com and sign in with Google"],
          ["2","Click Add project → name it anything → Continue"],
          ["3","Click Create project"],
          ["4","Click the </> Web icon → give it a nickname → Register app"],
          ["5","You'll see a firebaseConfig object — leave this page open for Step 2"],
          ["6","Left sidebar: Build → Firestore Database → Create database → Start in test mode → Enable"],
        ].map(function(row){
          return e("div",{key:row[0],style:{display:"flex",gap:"14px",padding:"12px 0",borderBottom:"1px solid "+C.border}},
            e("div",{style:{width:"22px",height:"22px",minWidth:"22px",background:C.cyan+"22",border:"1px solid "+C.cyan+"44",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",color:C.cyan,fontWeight:"700"}},row[0]),
            e("div",{style:{fontSize:"12px",color:C.text,lineHeight:"1.7"}},row[1])
          );
        }),
        e("div",{style:{marginTop:"20px"}},e(Btn,{onClick:function(){setStep(2);},color:C.cyan},"I created the project →"))
      ),
      step===2&&e(Section,{title:"Step 2 — Paste Your Firebase Config",accent:C.cyan},
        e("div",{style:{fontSize:"12px",color:C.muted,marginBottom:"16px",lineHeight:"1.8"}},"On the Firebase page, find the firebaseConfig object. Copy the entire { } block."),
        e(Label,{text:"PASTE YOUR CONFIG BELOW"}),
        e(TA,{value:ct,onChange:setCt,placeholder:"{ apiKey: '...', projectId: '...', ... }",rows:9}),
        err&&e("div",{style:{fontSize:"11px",color:C.red,margin:"8px 0"}},err),
        e("div",{style:{display:"flex",gap:"8px",marginTop:"16px"}},
          e(Btn,{onClick:function(){var c=parseConfig();if(c) setStep(3);},color:C.cyan},"Verify & Continue →"),
          e(Btn,{onClick:function(){setStep(1);},color:C.muted,outline:true,small:true},"← Back")
        )
      ),
      step===3&&e(Section,{title:"Step 3 — Set Your Sync Key",accent:C.cyan},
        e("div",{style:{fontSize:"12px",color:C.muted,marginBottom:"16px",lineHeight:"1.8"}},"Your sync key links all your devices. Keep it private."),
        e("div",{style:{background:C.card,border:"1px solid "+C.cyan+"33",borderRadius:"8px",padding:"20px",marginBottom:"16px",textAlign:"center"}},
          e(Label,{text:"YOUR SYNC KEY"}),
          e("div",{style:{fontSize:"24px",color:C.cyan,fontWeight:"700",letterSpacing:"6px",margin:"10px 0 14px"}},key),
          e(Inp,{value:key,onChange:function(v){setKey(v.toUpperCase().replace(/[^A-Z0-9-]/g,""));},placeholder:"Or type your own key"}),
          e("div",{style:{marginTop:"10px"}},e(Btn,{onClick:function(){setKey(genKey());},color:C.muted,small:true,outline:true},"↻ Generate new key"))
        ),
        e("div",{style:{background:"#ffb34720",border:"1px solid "+C.amber+"44",borderRadius:"8px",padding:"12px",marginBottom:"16px",fontSize:"11px",color:C.amber,lineHeight:"1.7"}},"⚠ Write this key down somewhere safe. If you lose it, you won't be able to reconnect."),
        err&&e("div",{style:{fontSize:"11px",color:C.red,marginBottom:"12px"}},err),
        e("div",{style:{display:"flex",gap:"8px"}},
          e(Btn,{onClick:handleConnect,color:C.cyan,disabled:busy},busy?"Connecting...":"Connect & Sync →"),
          e(Btn,{onClick:function(){setStep(2);},color:C.muted,outline:true,small:true},"← Back")
        )
      ),
      e(Section,{title:"Important: Update Firestore Rules",accent:C.amber},
        e("div",{style:{fontSize:"12px",color:C.muted,lineHeight:"1.8",marginBottom:"14px"}},"Firebase test mode expires in 30 days. To keep sync working permanently:"),
        e("div",{style:{background:"#0a0f0a",border:"1px solid "+C.green+"33",borderRadius:"8px",padding:"16px",marginBottom:"14px"}},
          e("div",{style:{fontSize:"11px",color:C.muted,marginBottom:"8px"}},"Firebase Console → Firestore → Rules → paste this → Publish:"),
          e("pre",{style:{fontSize:"11px",color:C.green,lineHeight:"1.7",whiteSpace:"pre-wrap"}},"rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /investmentOS/{syncKey} {\n      allow read, write: if true;\n    }\n  }\n}")
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
